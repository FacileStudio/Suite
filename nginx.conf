map $http_accept_language $fc_accept_raw {
    default en;
    "~*(?:^|,)[ \t]*(fr|en|es|de)(?![a-z])" $1;
}

map $fc_accept_raw $fc_accept {
    default en;
    ~*^fr$ fr;
    ~*^es$ es;
    ~*^de$ de;
}

map $http_user_agent $fc_fallback {
    default $fc_accept;
    "~*(bot|crawl|spider|slurp|facebookexternalhit|whatsapp|telegram|embedly|preview|skype|pinterest)" fr;
}

map $cookie_fc_locale $fc_want {
    default $fc_fallback;
    fr fr;
    en en;
    es es;
    de de;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    rewrite ^/(.+)/$ /$1 permanent;

    location = / {
        add_header Vary "Accept-Language, Cookie, User-Agent" always;
        if ($fc_want != fr) {
            return 302 /$fc_want$is_args$args;
        }
        try_files /index.html =404;
    }

    location = /auto-hebergement {
        add_header Vary "Accept-Language, Cookie, User-Agent" always;
        if ($fc_want != fr) {
            return 302 /$fc_want/auto-hebergement$is_args$args;
        }
        try_files /auto-hebergement.html =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
