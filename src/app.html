<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="text-scale" content="scale" />

    <title>Facile Suite · Every Facile tool in one place</title>
    <meta name="description" content="Tools that talk to each other on your own server: time, projects, invoices and monitoring behind one login." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Facile" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://suite.facile.studio/" />
    <meta property="og:title" content="Facile Suite · Every Facile tool in one place" />
    <meta property="og:description" content="Tools that talk to each other on your own server: time, projects, invoices and monitoring behind one login." />
    <meta property="og:image" content="https://suite.facile.studio/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Facile Suite: Every Facile tool in one place" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Facile Suite · Every Facile tool in one place" />
    <meta name="twitter:description" content="Tools that talk to each other on your own server: time, projects, invoices and monitoring behind one login." />
    <meta name="twitter:image" content="https://suite.facile.studio/og-image.png" />

    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('suite-theme');
          if (theme === 'light' || theme === 'dark') document.documentElement.classList.add(theme);
        } catch (e) {}
      })();
    </script>

    <script defer src="https://vision.facile.studio/s.js"></script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-fc-page text-fc-fg antialiased">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
