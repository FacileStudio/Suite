<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="text-scale" content="scale" />

    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />

    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('suite-theme');
          if (theme === 'light' || theme === 'dark') document.documentElement.classList.add(theme);
        } catch (e) {}
      })();
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Facile Suite" />
    <meta property="og:url" content="https://suite.facile.studio/" />
    <meta property="og:image" content="https://suite.facile.studio/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://suite.facile.studio/og-image.png" />

    <script defer src="https://vision.facile.studio/s.js"></script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-fc-page text-fc-fg antialiased">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
